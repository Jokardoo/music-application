version: '1.0'

services:
  db:
    image: postgres
    container_name: music-db
    restart: always
    environment:
      POSTGRES_PASSWORD: qwerty
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "-A md5"
    ports:
      - "6432:5432"

  redis:
    image: redis:7-alpine
    container_name: music-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes

