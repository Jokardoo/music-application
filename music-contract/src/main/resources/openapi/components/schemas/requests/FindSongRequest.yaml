type: object
properties:
  musicianName:
    description: Имя музыканта
    type: string
    minLength: 1
    maxLength: 255
    x-size-message: "Name size should be between 1 and 255 characters!"
    example: Muse
  songName:
    description: Название песни
    type: string
    minLength: 2
    maxLength: 100
    x-size-message: "Song name size should be between 2 and 100 characters!"
    example: Supermassive black hole
  minDurationInSeconds:
    description: Минимальная продолжительность в секундах
    type: integer
    minimum: 1
    x-min-message: "'Min duration' should be positive!"
    example: 182
  maxDurationInSeconds:
    description: Максимальная продолжительность в секундах
    type: integer
    minimum: 1
    x-min-message: "'Max duration' should be positive!"
    example: 30