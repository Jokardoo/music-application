type: object
required:
  - musicianName
  - songName
properties:
  musicianName:
    type: string
    minLength: 2
    maxLength: 100
    x-size-message: "Musician name size should be between 2 and 100 characters!"
    description: Имя музыканта
    example: Muse
  songName:
    type: string
    minLength: 2
    maxLength: 100
    x-size-message: "Song name size should be between 2 and 100 characters!"
    description: Название песни
    example: Supermassive black hole
  albumName:
    type: string
    minLength: 2
    maxLength: 100
    description: Название альбома
    x-size-message: "Album name size should be between 2 and 100 characters!"
    example: Black Holes and Revelations
  musicGenre:
    $ref: '../../../openapi.yaml#/components/schemas/MusicGenre'
  releaseDate:
    type: string
    format: date
    description: Дата релиза
    example: 2006:06