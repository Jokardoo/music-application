plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'jacoco'
	id 'org.sonarqube' //version '7.2.3.7755'
	id 'com.google.protobuf'// version '0.9.6' // Рекомендуемая версия для Boot 4.1
}

group = 'ru.jokardo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencies {
	// ─── Spring Boot Starters ───
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation("org.springframework.boot:spring-boot-starter-webmvc")
	implementation("org.springframework.boot:spring-boot-starter-data-jpa")
	implementation("org.springframework.boot:spring-boot-starter-validation")
	implementation("org.springframework.boot:spring-boot-starter-actuator")
	implementation("org.springframework.boot:spring-boot-starter-liquibase")
	implementation 'org.springframework.boot:spring-boot-starter-grpc-client'

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

	// ─── Парсинг HTML ───
	implementation 'org.jsoup:jsoup:1.22.2'

	// ─── База данных ───
	runtimeOnly("org.postgresql:postgresql")

	// ─── Lombok ───
	compileOnly("org.projectlombok:lombok:1.18.34")
	annotationProcessor("org.projectlombok:lombok:1.18.34")

	// ─── Тесты ───
	testImplementation("org.springframework.boot:spring-boot-starter-test")
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation("org.springframework.security:spring-security-test")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
	testImplementation("org.testcontainers:testcontainers-junit-jupiter")
	testImplementation("org.testcontainers:testcontainers-postgresql")
	testImplementation "com.redis:testcontainers-redis:2.2.2"
	testImplementation "org.springframework.boot:spring-boot-testcontainers"

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	testImplementation("org.springframework.boot:spring-boot-starter-test")
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation("org.springframework.security:spring-security-test")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
	testImplementation("org.testcontainers:testcontainers-junit-jupiter")
	testImplementation("org.testcontainers:testcontainers-postgresql")
	testImplementation "com.redis:testcontainers-redis:2.2.2"
	testImplementation "org.springframework.boot:spring-boot-testcontainers"

	// dto
	implementation("jokardo.ru:auth-contract:1.0.0")
	implementation('ru.jokardo:shared-dtos:1.0.0')

	// open-api
	implementation project(':music-contract')

	// Воспроизведение музыки
	implementation 'javazoom:jlayer:1.0.1'

}

jacoco {
	toolVersion = '0.8.13'
}

jacocoTestReport {
	// Отчёт должен строиться после тестов
	dependsOn test

	// Исключаем сгенерированный код из отчёта
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
					'**/constants/**',
					'**/generated/**',
					'**/exception/**',
					'**/*AdviceControllerGrpc.class',
					'**/*MapperImpl.class',
					'**/*Builder.class'
			])
		}))
	}

	reports {
		// XML нужен SonarQube, HTML — для локального просмотра
		xml.required = true
		html.required = true
		csv.required = false
	}
}

// ============ SonarQube ============
sonar {
	properties {
		property 'sonar.projectKey', 'music-service'
		property 'sonar.projectName', 'music-service'

		property 'sonar.host.url', 'http://localhost:9000'

		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'

		property 'sonar.java.coveragePlugin', 'jacoco'

		property 'sonar.java.source', '21'
		property 'sonar.java.target', '21'
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.named('sonar') {
	dependsOn test
}

